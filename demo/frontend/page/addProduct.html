<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Produk</title>
  <link rel="stylesheet" href="../css/add.css">
</head>
<body>
  <div class="container">
    <h2>Tambah Produk Baru</h2>

    <!-- Form untuk menambahkan produk -->
    <form id="addProductForm">
      <div class="form-group">
        <label for="name">Nama Produk</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-group">
        <label for="brand">Brand</label>
        <input type="text" id="brand" name="brand" required>
      </div>

      <div class="form-group">
        <label for="category">Kategori</label>
        <input type="text" id="category" name="category" required>
      </div>

      <div class="form-group">
        <label for="description">Deskripsi</label>
        <input type="text" id="description" name="description" required>
      </div>

      <div class="form-group">
        <label for="tahun_rilis">Tahun Rilis</label>
        <input type="number" id="tahun_rilis" name="tahun_rilis" required>
      </div>

      <div class="form-group">
        <label for="price">Harga</label>
        <input type="number" id="price" name="price" required>
      </div>

      <div class="form-group">
        <label for="stok">Stok</label>
        <input type="number" id="stok" name="stok" required>
      </div>



      <div class="form-group">
        <label for="image">Pilih Gambar Produk (atau masukkan URL)</label>
        <input type="file" id="image" name="image" accept="image/*">
        <p>Atau masukkan URL gambar dari Google Drive:</p>
        <input type="url" id="imageURL" name="imageURL" placeholder="Link Google Drive">
    </div>

      <button type="submit">Tambah Produk</button>
    </form>

    <div id="responseMessage" class="response-message"></div>
  </div>

  <script src="../js/add.js"></script>
</body>
</html>
